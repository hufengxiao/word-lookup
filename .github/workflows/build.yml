name: Build Windows EXE

# 触发方式：
#   1) 推送形如 v* 的 tag（如 v1.0.0）→ 自动构建并发布 GitHub Release
#   2) 手动: 仓库 Actions 页 → 本工作流 → Run workflow
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller python-lzo

      - name: Build exe (PyInstaller)
        run: |
          pyinstaller --noconfirm wordlookup.spec

      - name: List artifacts
        run: Get-ChildItem dist

      - name: Smoke test — exe 启动存活检查
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\WordLookup.exe"
          # 启动 exe（首启应弹出初始化对话框等待，进程保持存活即 GUI 启动成功）
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 30
          if ($p.HasExited) {
            Write-Error "exe 在 30 秒内退出了(exit=$($p.ExitCode))，GUI 启动失败 / 闪退"
            exit 1
          } else {
            Write-Host "PASS: WordLookup.exe 启动后进程存活 (PID $($p.Id))"
            # 测试结束关闭该进程，避免遗留
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload exe artifact (workflow 界面可下载)
        uses: actions/upload-artifact@v4
        with:
          name: WordLookup-windows
          path: dist/WordLookup.exe

      # 仅 tag 推送时发布到 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WordLookup.exe
          generate_release_notes: true
          draft: false