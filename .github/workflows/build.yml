name: Build Windows EXE

# 触发方式：
#   1) 推送形如 v* 的 tag（如 v1.0.0）→ 自动构建并发布 GitHub Release
#   2) 手动: 仓库 Actions 页 → 本工作流 → Run workflow
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller python-lzo

      - name: Build exe (PyInstaller)
        run: |
          pyinstaller --noconfirm wordlookup.spec

      - name: List artifacts
        run: Get-ChildItem dist

      - name: GUI 逻辑冒烟 (offscreen) — 搜索/详情/透明度/拖动
        shell: pwsh
        run: |
          # 用最小词典跑 smoke_test.py，验证搜索、详情窗口创建&非空、透明度、拖动逻辑
          python -c "import sqlite3; c=sqlite3.connect('oxford_test.db'); \
            c.execute('CREATE TABLE words(id INTEGER PRIMARY KEY,key TEXT,key_lower TEXT,html TEXT)'); \
            c.execute('CREATE INDEX idx_words_key_lower ON words(key_lower)'); \
            c.executemany('INSERT INTO words(key,key_lower,html) VALUES(?,?,?)', [('apple','apple','<p>apple</p>'),('hello','hello','<p>hello</p>'),('world','world','<p>world</p>')]); c.commit()"
          $env:DB = (Join-Path $PWD 'oxford_test.db')
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:PYTHONIOENCODING = 'utf-8'
          python smoke_test.py
          if ($LASTEXITCODE -ne 0) { Write-Error "GUI 逻辑冒烟失败"; exit 1 }
          if (-not (Test-Path smoke_result.txt)) { Write-Error "未生成 smoke_result.txt"; exit 1 }
          Get-Content smoke_result.txt

      - name: Smoke test — exe 启动存活 + 窗口显示检查
        shell: pwsh
        run: |
          # 生成一个最小词典 db，让 exe 走「加载词典→显示主窗口」路径
          python -c "import sqlite3; c=sqlite3.connect('smoke_test.db'); \
            c.execute('CREATE TABLE words(id INTEGER PRIMARY KEY,key TEXT,key_lower TEXT,html TEXT)'); \
            c.execute('CREATE INDEX idx_words_key_lower ON words(key_lower)'); \
            c.executemany('INSERT INTO words(key,key_lower,html) VALUES(?,?,?)', [('apple','apple','<p>apple</p>'),('hello','hello','<p>hello</p>'),('world','world','<p>world</p>')]); c.commit()"
          Write-Host "smoke db created"

          $exe = Join-Path $PWD "dist\WordLookup.exe"
          # 日志写在 exe 同目录 (dist/)
          $logFile = Join-Path $PWD "dist\WordLookup.log"
          Remove-Item -Path $logFile -ErrorAction SilentlyContinue

          # 带 --show 启动，直接进入主窗口显示路径
          $p = Start-Process -FilePath $exe -ArgumentList "--show","$(Join-Path $PWD 'smoke_test.db')" -PassThru
          Start-Sleep -Seconds 35

          # 断言1: 进程应存活（不闪退）
          if ($p.HasExited) {
            Write-Error "exe 在 35 秒内退出了(exit=$($p.ExitCode))，GUI 启动失败 / 闪退"
            if (Test-Path $logFile) { Write-Host "---- WordLookup.log ----"; Get-Content $logFile }
            exit 1
          }
          # 断言2: exe 旁日志应包含 window shown（窗口真实显示成功）
          Start-Sleep -Seconds 3
          $logOK = $false
          if (Test-Path $logFile) {
            $logOK = (Select-String -Path $logFile -Pattern "window shown" -Quiet)
            Write-Host "---- WordLookup.log (dist) ----"
            Get-Content $logFile
          } else {
            Write-Host "!! 未找到日志文件: $logFile"
          }
          if (-not $logOK) {
            Write-Error "exe 进程未退出但窗口未显示（log 无 'window shown'）"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "PASS: WordLookup.exe 启动并成功显示窗口 (PID $($p.Id))"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload exe artifact (workflow 界面可下载)
        uses: actions/upload-artifact@v4
        with:
          name: WordLookup-windows
          path: dist/WordLookup.exe

      # 仅 tag 推送时发布到 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WordLookup.exe
          generate_release_notes: true
          draft: false