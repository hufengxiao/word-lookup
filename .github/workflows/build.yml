name: Build Windows EXE

# 触发方式：
#   1) 推送形如 v* 的 tag（如 v1.0.0）→ 自动构建并发布 GitHub Release
#   2) 手动: 仓库 Actions 页 → 本工作流 → Run workflow
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller python-lzo

      - name: Build exe (PyInstaller)
        run: |
          pyinstaller --noconfirm wordlookup.spec

      - name: List artifacts
        run: Get-ChildItem dist

      - name: Smoke test — exe 启动存活检查
        shell: pwsh
        run: |
          # 生成一个最小词典 db，让 exe 走「加载词典→显示主窗口」路径
          python -c "import sqlite3,os; c=sqlite3.connect('smoke_test.db'); \
            c.execute('CREATE TABLE words(id INTEGER PRIMARY KEY,key TEXT,key_lower TEXT,html TEXT)'); \
            c.execute('CREATE INDEX idx_words_key_lower ON words(key_lower)'); \
            c.executemany('INSERT INTO words(key,key_lower,html) VALUES(?,?,?)', [('apple','apple','<p>apple</p>'),('hello','hello','<p>hello</p>'),('world','world','<p>world</p>')]); c.commit()"
          Write-Host "smoke db created"

          # 带 --show 启动，直接进入主窗口显示路径（arg 里的 .db 会被程序识别）
          $exe = Join-Path $PWD "dist\WordLookup.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--show","smoke_test.db" -PassThru
          Start-Sleep -Seconds 35
          if ($p.HasExited) {
            Write-Error "exe 在 35 秒内退出了(exit=$($p.ExitCode))，GUI 启动失败 / 闪退"
            Get-ChildItem -Path $PWD -Filter "WordLookup.log" | ForEach-Object { Write-Host "---- WordLookup.log ----"; Get-Content $_ }
            exit 1
          } else {
            Write-Host "PASS: WordLookup.exe 启动后进程存活 (PID $($p.Id))"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload exe artifact (workflow 界面可下载)
        uses: actions/upload-artifact@v4
        with:
          name: WordLookup-windows
          path: dist/WordLookup.exe

      # 仅 tag 推送时发布到 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WordLookup.exe
          generate_release_notes: true
          draft: false