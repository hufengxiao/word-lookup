name: Build Windows EXE

# 触发：
#   1) 推送 v* tag → 自动构建并发布 GitHub Release
#   2) 手动: 仓库 Actions 页 → 本工作流 → Run workflow
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches: [ main ]

# 同一 ref 的多次并发构建/发布取最新、取消旧的，避免 tag 连发时互相踩踏 (C5)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  # ---- 1) Lint + 逻辑单测：跨 3 个 Python 版本，headless (C3) ----
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20                 # C4
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'                  # C1: pip 缓存（按 lock/requirements hash）
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest
      - name: Ruff lint
        run: ruff check .
      - name: Unit tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/

  # ----------------------------------------------------------------
  # 2 / Windows 打包 + exe: 3.11 一次，产出 release
  # ----------------------------------------------------------------
  build:
    runs-on: windows-latest
    timeout-minutes: 25                 # C4
    needs: lint-test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'                  # C1
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller python-lzo
      - name: Build exe (PyInstaller)
        run: pyinstaller --noconfirm wordlookup.spec
      - name: List artifacts
        run: Get-ChildItem dist
      - name: GUI 逻辑冒烟 (offscreen) — 搜索/详情/透明度/拖动
        shell: pwsh
        run: |
          # 用 smoke_db.py 生成最小词典库（双击不重复裸 SQL，C2）
          python smoke_db.py oxford_test.db
          $env:DB  = (Join-Path $PWD 'oxford_test.db')
          $env:QT_QPA_PLATFORM = 'offscreen'
          python smoke_test.py
          if ($LASTEXITCODE -ne 0) { Write-Error "GUI 逻辑冒烟失败"; exit 1 }
          if (-not (Test-Path smoke_result.txt)) { Write-Error "未生成 smoke_result.txt"; exit 1 }
          Get-Content smoke_result.txt
        env:
          PYTHONIOENCODING: utf-8
      - name: Smoke test — exe 启动存活 + 窗口显示
        shell: pwsh
        run: |
          python smoke_db.py smoke_test.db
          $exe     = Join-Path $PWD "dist\WordLookup.exe"
          $logFile = Join-Path $PWD "dist\WordLookup.log"
          Remove-Item -Path $logFile -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -ArgumentList "--show","$(Join-Path $PWD 'smoke_test.db')" -PassThru
          Start-Sleep -Seconds 35
          if ($p.HasExited) {
            Write-Error "exe 在 35 秒内退出 (exit=$($p.ExitCode))，GUI 启动失败 / 闪退"
            if (Test-Path $logFile) { Get-Content $logFile }
            exit 1
          }
          Start-Sleep -Seconds 3
          $ok = (Test-Path $logFile) -and (Select-String -Path $logFile -Pattern "window shown" -Quiet)
          if (Test-Path $logFile) { Write-Host "---- dist\WordLookup.log ----"; Get-Content $logFile }
          else { Write-Host "!! 未找到日志: $logFile" }
          if (-not $ok) {
            Write-Error "exe 进程存活但窗口未显示（log 无 'window shown'）"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "PASS: WordLookup.exe 启动并显示窗口 (PID $($p.Id))"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
        env:
          PYTHONIOENCODING: utf-8
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordLookup-windows
          path: dist/WordLookup.exe
      # 仅 tag 推送时发布到 GitHub Release (复用 CHANGELOG 链接的 release notes)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WordLookup.exe
          generate_release_notes: true
          draft: false