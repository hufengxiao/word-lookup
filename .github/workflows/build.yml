name: Build Windows EXE

# 触发方式：
#   1) 推送形如 v* 的 tag（如 v1.0.0）→ 自动构建并发布 GitHub Release
#   2) 手动: 仓库 Actions 页 → 本工作流 → Run workflow
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller python-lzo

      - name: Build exe (PyInstaller)
        run: |
          pyinstaller --noconfirm wordlookup.spec

      - name: List artifacts
        run: Get-ChildItem dist

      - name: Upload exe artifact (workflow 界面可下载)
        uses: actions/upload-artifact@v4
        with:
          name: WordLookup-windows
          path: dist/WordLookup.exe

      # 仅 tag 推送时发布到 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WordLookup.exe
          generate_release_notes: true
          draft: false